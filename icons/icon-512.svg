<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main orange gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ff6b1a"/>
      <stop offset="50%"  stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Inner glow gradient -->
    <radialGradient id="glowGrad" cx="35%" cy="30%" r="60%">
      <stop offset="0%"   stop-color="#ff9f1c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Shimmer on letters -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#ffe0c8" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Dot accent gradient -->
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fff5ee"/>
      <stop offset="100%" stop-color="#ffba7a"/>
    </linearGradient>

    <!-- Clip for rounded square -->
    <clipPath id="roundClip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>

    <!-- Drop shadow filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#7c2d00" flood-opacity="0.35"/>
    </filter>

    <!-- Glow filter for text -->
    <filter id="textGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- Inner radial glow overlay -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#glowGrad)"/>

  <!-- Subtle top highlight -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112"
        fill="url(#topHighlight)" opacity="0.15"/>

  <!-- Noise/grain texture circles (decorative subtle pattern) -->
  <circle cx="90"  cy="90"  r="160" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="90"  cy="90"  r="220" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <circle cx="422" cy="422" r="160" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="422" cy="422" r="220" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Top-left shine arc -->
  <path d="M 60 112 Q 112 60 180 56" fill="none"
        stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 56 160 Q 56 80 140 56" fill="none"
        stroke="rgba(255,255,255,0.10)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- === MAIN TEXT: JV === -->
  <!-- J -->
  <text x="76" y="320"
        font-family="'Arial Black', 'Helvetica Neue', sans-serif"
        font-weight="900"
        font-size="248"
        fill="url(#textGrad)"
        filter="url(#textGlow)"
        letter-spacing="-8">J</text>

  <!-- V -->
  <text x="224" y="320"
        font-family="'Arial Black', 'Helvetica Neue', sans-serif"
        font-weight="900"
        font-size="248"
        fill="url(#textGrad)"
        filter="url(#textGlow)"
        letter-spacing="-8">V</text>

  <!-- Orange accent dot — signature brand mark -->
  <circle cx="430" cy="300" r="28" fill="url(#dotGrad)" filter="url(#softShadow)"/>
  <circle cx="430" cy="300" r="18" fill="rgba(255,255,255,0.9)"/>

  <!-- "OR DEV" small label at bottom -->
  <rect x="112" y="358" width="288" height="64" rx="32" ry="32"
        fill="rgba(0,0,0,0.22)"/>
  <text x="256" y="401"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-weight="700"
        font-size="30"
        fill="rgba(255,255,255,0.92)"
        text-anchor="middle"
        letter-spacing="5">JVOR DEV</text>

  <!-- Bottom-right subtle shine -->
  <path d="M 452 400 Q 456 456 400 456" fill="none"
        stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
